<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIRC — Registros Criminais</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/registros.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="ambient-light"></div>
  <div class="ambient-light-2"></div>

  <div class="app-shell">
    <aside id="app-sidebar"></aside>

    <main class="main">
      <div id="app-banner"></div>

      <div class="page-container">
        <header class="page-header">
          <h2>Registros de Qualificação Criminal</h2>
          <p>Cadastre, edite e consulte os registros da delegacia.</p>
        </header>

        <div class="toolbar">
          <div class="search-wrap">
            <span id="search-icon"></span>
            <input type="text" id="search-input"
                   placeholder="Buscar por nome ou número do registro..."
                   autocomplete="off" />
          </div>
          <button class="btn btn-primary" id="btn-new-record" type="button">
            <span id="plus-icon"></span>
            Novo registro
          </button>
        </div>

        <div id="records-table-wrap"></div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="js/icons.js?v=3"></script>
  <script src="js/store.js?v=3"></script>
  <script src="js/components.js?v=3"></script>
  <script src="js/dashboard.js?v=3"></script>
  <script src="js/registros.js?v=3"></script>
  <script src="js/interactions.js?v=3"></script>
</body>
</html>
